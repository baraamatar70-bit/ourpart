<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>غير مخول</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #ccc;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
      overflow: hidden;
    }
    .container {
      text-align: center;
      max-width: 700px;
      padding: 40px;
      position: relative;
    }
    .container::before {
      content: '✕';
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 120px;
      color: #1a1a1a;
      z-index: -1;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      opacity: 0.3;
    }
    h1 {
      color: #444;
      font-size: 18px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    .message {
      font-size: 22px;
      line-height: 2.2;
      color: #666;
      margin-bottom: 40px;
    }
    .message strong {
      color: #888;
    }
    .message .highlight {
      color: #e94560;
      font-weight: bold;
    }
    .divider {
      width: 60px;
      height: 1px;
      background: #333;
      margin: 30px auto;
    }
    .footer {
      font-size: 13px;
      color: #333;
      letter-spacing: 2px;
    }
    .fade-in {
      animation: fadeIn 2s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container fade-in">
    <div class="icon">🚫</div>
    
    <h1>الوصول مرفوض</h1>
    
    <div class="message">
      <p>
        عذراً، لكن <strong>أنتم</strong> لستم بـ<strong class="highlight">قدرنا</strong>.
      </p>
      <p>
        ولستم بـ<strong class="highlight">مستوانا</strong>.
      </p>
      <p>
        ولستم <strong class="highlight">مخولين</strong> بالوجود هنا.
      </p>
      
      <div class="divider"></div>
      
      <p style="font-size: 18px; color: #555;">
        هذا المكان لمن يستحقونه فحسب.
      </p>
      <p style="font-size: 16px; color: #444; margin-top: 15px;">
        أما أنتم... فـ<strong class="highlight">الرحيل</strong> هو الواجب.
      </p>
      <p style="font-size: 14px; color: #333; margin-top: 20px;">
        لا حاجة لنا بمن لا يضيفون قيمةً لوجودهم.
      </p>
    </div>
    
    <div class="divider"></div>
    
    <div class="footer">
      هذا القرار نهائي وغير قابل للنقاش
    </div>
  </div>

  <script>
    // منع الرجوع
    history.pushState(null, null, location.href);
    window.onpopstate = function() {
      history.go(1);
    };
  </script>

</body>
</html>
