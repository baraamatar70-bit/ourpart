  <body>
<audio id="music" src="../music.mp3" loop></audio>

<button onclick="startMusic()" id="btn" 
  style="position:fixed; bottom:20px; right:20px; 
         background:#ff4757; color:white; border:none; 
         border-radius:50px; padding:12px 24px; cursor:pointer;">
  🎵 تشغيل الموسيقى
</button>

<script>
  const music = document.getElementById('music');

  function startMusic() {
    music.play();
    document.getElementById('btn').style.display = 'none';
  }

  // إذا توقفت لأي سبب — شغلها فوراً
  music.addEventListener('pause', function() {
    music.play();
  });

  // إذا علقت بسبب النت — انتظر ثانية وشغلها
  music.addEventListener('waiting', function() {
    setTimeout(() => {
      music.play();
    }, 1000);
  });

  // إذا انتهت — ارجع للبداية وشغلها
  music.addEventListener('ended', function() {
    music.currentTime = 0;
    music.play();
  });

  // فحص كل ثانية: متوقفة؟ شغلها!
  setInterval(() => {
    if (music.paused) {
      music.play();
    }
  }, 1000);
</script>
    <div id="root"></div>
  </body>
