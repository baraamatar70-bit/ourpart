  <body>

    <!-- 🎵 الموسيقى: preload + autoplay + loop -->
    <audio id="music" src="music.mp3" preload="auto" autoplay loop></audio>

    <!-- زر التشغيل (يختفي بعد الضغط) -->
    <button onclick="startMusic()" id="btn" 
      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:#ff4757; color:white; border:none; 
             border-radius:50px; padding:12px 24px; cursor:pointer; font-size:16px;">
      🎵 تشغيل الموسيقى
    </button>

    <script>
      const music = document.getElementById('music');

      function startMusic() {
        music.play();
        document.getElementById('btn').style.display = 'none';
      }

      // 🔄 إذا توقفت لأي سبب — شغلها فوراً
      music.addEventListener('pause', function() {
        if (music.readyState >= 2) music.play();
      });

      // ⏳ إذا علقت بسبب النت — انتظر وشغلها
      music.addEventListener('waiting', function() {
        setTimeout(() => {
          if (music.paused) music.play();
        }, 500);
      });

      // 🔁 إذا انتهت — ارجع للبداية وشغلها
      music.addEventListener('ended', function() {
        music.currentTime = 0;
        music.play();
      });

      // 🛡️ فحص كل نصف ثانية: متوقفة؟ شغلها!
      setInterval(() => {
        if (music.paused && music.readyState >= 2) {
          music.play().catch(() => {});
        }
      }, 500);

      // 🚀 محاولة تشغيل تلقائي عند تحميل الصفحة
      window.addEventListener('load', function() {
        music.play().catch(() => {
          // إذا المتصفح منع autoplay، يظهر الزر
          console.log('Autoplay blocked, waiting for user interaction');
        });
      });
    </script>

    <div id="root"></div>
  </body>
