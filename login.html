<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>الدخول للموقع</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      direction: rtl;
    }
    .box {
      background: rgba(22, 33, 62, 0.95);
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 0 50px rgba(233, 69, 96, 0.3);
      text-align: center;
      width: 400px;
      border: 1px solid rgba(233, 69, 96, 0.2);
    }
    .box h2 { 
      margin-bottom: 10px; 
      color: #e94560; 
      font-size: 28px;
    }
    .box .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .box input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      background: #0f3460;
      color: white;
      font-size: 16px;
      text-align: center;
      border: 2px solid transparent;
      transition: 0.3s;
    }
    .box input:focus {
      border-color: #e94560;
      outline: none;
    }
    .box button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #e94560;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }
    .box button:hover { 
      background: #ff6b6b; 
      transform: translateY(-2px);
    }
    .separator {
      margin: 20px 0;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🎭 التحقق من الهوية</h2>
    <p class="subtitle">هذا الموقع خاص — يرجى إدخال اسمك الكامل</p>
    
    <input type="text" id="firstName" placeholder="الاسم الأول">
    <input type="text" id="lastName" placeholder="الكنية / اللقب">
    
    <button onclick="checkIdentity()">دخول</button>
  </div>

  <script>
    // الأسماء المستهدفة (كل الصيغ)
    const TARGET_NAMES = [
      'فاطمة', 'فاطمه', 'فطمة', 'فطمه',
      'fatema', 'fatima', 'fatemeh', 'fatma',
      'رندا', 'رندى',
      'randa', 'randa'
    ];

    // الكنية المستهدفة
    const TARGET_LASTNAME = 'بغدادي';

    function normalize(text) {
      return text
        .toLowerCase()
        .trim()
        .replace(/ى/g, 'ا')
        .replace(/ي/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/[^\w\s]/g, '');
    }

    function checkIdentity() {
      const first = normalize(document.getElementById('firstName').value);
      const last = normalize(document.getElementById('lastName').value);
      
      const isTargetName = TARGET_NAMES.some(n => first.includes(normalize(n)));
      const isTargetLast = last.includes(normalize(TARGET_LASTNAME));

      // الحالة 1: الاسم مستهدف + الكنية بغدادي = حظر
      if (isTargetName && isTargetLast) {
        window.location.href = 'blocked.html';
        return;
      }

      // الحالة 2: الاسم مستهدف لكن الكنية غير بغدادي = حظر أيضاً
      if (isTargetName && !isTargetLast) {
        window.location.href = 'blocked.html';
        return;
      }

      // الحالة 3: أي اسم آخر = مسموح
      // نحفظ الاسم وننتقل للموقع الرئيسي
      localStorage.setItem('guest_name', document.getElementById('firstName').value);
      localStorage.setItem('guest_last', document.getElementById('lastName').value);
      window.location.href = 'index.html';
    }

    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkIdentity();
    });
  </script>

</body>
</html>
